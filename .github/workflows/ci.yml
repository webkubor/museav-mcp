name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: pnpm build
      # 冒烟：MCP server 是 stdio 服务，没有 --version/--help 可查，
      # 只能真起一次 server 走 initialize + tools/list（test-mcp.mjs 干这个）
      - run: node test-mcp.mjs
